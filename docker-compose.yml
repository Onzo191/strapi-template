# Local development stack: `docker compose up` boots postgres + redis + cms + web.
# Secrets here are DEV-ONLY placeholders. Never reuse in staging/prod.
name: vng-platform

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: vng
      POSTGRES_USER: vng
      POSTGRES_PASSWORD: vng
    # Host port 5433 (container stays 5432) to avoid colliding with other
    # local Postgres stacks. Internal cms↔db traffic uses the compose network.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vng -d vng"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: devKey1,devKey2,devKey3,devKey4
      API_TOKEN_SALT: dev-api-token-salt
      ADMIN_JWT_SECRET: dev-admin-jwt-secret
      TRANSFER_TOKEN_SALT: dev-transfer-token-salt
      JWT_SECRET: dev-jwt-secret
      ENCRYPTION_KEY: dev-encryption-key-change-me
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: vng
      DATABASE_USERNAME: vng
      DATABASE_PASSWORD: vng
      DATABASE_SSL: "false"
    ports:
      - "1337:1337"
    volumes:
      - cmsuploads:/app/apps/cms/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-side calls to Strapi go over the compose network.
      STRAPI_URL: http://cms:1337
      # Redis is provisioned for the ISR cache handler wired in phase P3.
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - cms
      - redis

volumes:
  pgdata:
  redisdata:
  cmsuploads:
