# Local development stack: the two applications, on top of the infrastructure
# declared in docker-compose.infra.yml (postgres, and optionally clamav).
#
#   docker compose up          # infra + cms + web
#
# `include` pulls the infra file in, so the command above still brings up
# everything. Bring up only the infrastructure with:
#
#   docker compose -f docker-compose.infra.yml up -d
#
# One instance of each app, deliberately (ADR-008): the ISR cache is Next's own
# per-instance cache, so a second web container would serve content that the
# publish webhook never invalidated. If you scale this stack out, read ADR-008
# first — the cache and the CMS rate limiter both assume a single instance.
#
# CONFIGURATION LIVES IN YOUR ENV FILES, NOT HERE. Each app service reads
# `apps/<app>/.env` then `apps/<app>/.env.local`; this file contributes only the
# values that cannot be right outside the compose network (service DNS names,
# container-internal ports) plus the two plain-http concessions. No secret appears
# in this file, so it stays safe to commit and there is one place — yours — where a
# credential is defined.
#
#   cp apps/cms/.env.example  apps/cms/.env
#   cp apps/web/.env.example  apps/web/.env.local
#
# Both env files are optional to compose, so `docker compose config` works on a
# fresh clone; the CMS will refuse to boot without APP_KEYS, which is the intended
# signal that you skipped the copy above. Postgres' own credentials are in
# docker-compose.infra.yml and must match DATABASE_* in apps/cms/.env (both default
# to vng/vng/vng).
name: vng-platform

include:
  - docker-compose.infra.yml

services:
  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    # Real configuration and secrets come from YOUR env files, not from this file.
    # `.env` is Strapi's convention, `.env.local` is the personal override; later
    # files win, and both are optional so `docker compose config` still works on a
    # fresh clone. Start from the template:
    #
    #   cp apps/cms/.env.example apps/cms/.env
    #
    # Nothing below is a secret: `environment:` holds only the values that are
    # *wrong by construction* outside this network — container-internal ports and
    # service DNS names — plus the two local-http concessions. Compose applies
    # `environment:` after `env_file`, so anything listed here overrides your file;
    # that is why no credential appears in it.
    env_file:
      - path: apps/cms/.env
        required: false
      - path: apps/cms/.env.local
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      # Container-internal port and DB address. Your .env points at localhost:5432
      # (the published port) so `strapi develop` on the host works; on this network
      # the CMS talks to the container directly.
      PORT: 1337
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      # All time values are stored at UTC+0 in timestamptz columns. config/database.ts
      # sets this in-process too (for the `pnpm dev` path, which has no container
      # env), but pinning it here means the process never briefly starts in another
      # zone. See apps/cms/src/bootstrap/timestamps.ts.
      TZ: UTC
      # Service DNS, not localhost: these are CMS→web calls inside the network.
      WEB_REVALIDATE_URL: http://web:3000/api/revalidate
      WEB_PREVIEW_URL: http://localhost:3000
      # CORS + admin-CSP allow-list — the browser reaches web on the published port.
      WEB_ALLOWED_ORIGINS: http://localhost:3000
      # Admin cookies must not be Secure over plain http, or login cannot
      # complete — NODE_ENV=production above would otherwise make them Secure.
      ADMIN_COOKIE_SECURE: "false"
      # Reached directly on the compose network, so XFF carries no trusted hop;
      # keying on ctx.request.ip is correct here.
      TRUSTED_PROXY_HOPS: "1"
    ports:
      - "1337:1337"
    volumes:
      - cmsuploads:/app/apps/cms/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: vng-web:local
    restart: unless-stopped
    # Same arrangement as `cms` above: your env files carry the real values.
    # `.env.local` is Next's convention and takes precedence over `.env`.
    #
    #   cp apps/web/.env.example apps/web/.env.local
    #
    # Two secrets here must MATCH the CMS side or the stack looks healthy and
    # misbehaves: STRAPI_API_TOKEN = the CMS's STRAPI_READONLY_API_TOKEN (otherwise
    # every page renders empty), and REVALIDATE_SECRET (otherwise published content
    # never appears without a rebuild).
    env_file:
      - path: apps/web/.env
        required: false
      - path: apps/web/.env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      # Service DNS, not localhost: server-side RSC fetches go over this network,
      # while your .env.local points at the published port for `next dev`.
      STRAPI_URL: http://cms:1337
    ports:
      - "3000:3000"
    depends_on:
      - cms

volumes:
  cmsuploads:
