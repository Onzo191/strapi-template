name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Change detection: which app(s) are affected. `packages/**` forces BOTH
  # because shared types / design-system feed web and cms alike (§8.3).
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      cms: ${{ steps.filter.outputs.cms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
            cms:
              - 'apps/cms/**'
              - 'packages/**'

  # ---------------------------------------------------------------------------
  # Quality: lint + typecheck + test + build, but only on the affected graph.
  # Turbo remote cache means unaffected tasks are restored, not re-run.
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint / typecheck / test / build (affected only)
        run: pnpm turbo run lint typecheck test build --filter='...[origin/main]'
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # ---------------------------------------------------------------------------
  # Deploy stubs — only on main, only for the affected app. The reusable
  # deploy-app.yml (build → ECR → migrations[cms] → ECS blue-green → health
  # check) lands in phase P6; kept as gated no-ops here.
  # ---------------------------------------------------------------------------
  deploy-web:
    needs: [detect, quality]
    if: needs.detect.outputs.web == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy web (implemented in P6 — deploy-app.yml)"

  deploy-cms:
    needs: [detect, quality]
    if: needs.detect.outputs.cms == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy cms (implemented in P6 — deploy-app.yml)"
