name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Change detection: which app(s) are affected. `packages/**` forces BOTH
  # because shared types / design-system feed web and cms alike (§8.3).
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      cms: ${{ steps.filter.outputs.cms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
            cms:
              - 'apps/cms/**'
              - 'packages/**'

  # ---------------------------------------------------------------------------
  # Quality: lint + typecheck + test + build, but only on the affected graph.
  # Turbo remote cache means unaffected tasks are restored, not re-run.
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint / typecheck / test / build (affected only)
        run: pnpm turbo run lint typecheck test build --filter='...[origin/main]'
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # ---------------------------------------------------------------------------
  # Playwright e2e + Lighthouse CI — gated on `web` since both only exercise
  # the web app. `loadResilient` degrades pages to `notFound()` without seeded
  # content, so this runs the real stack (postgres + redis + cms + web, seeded)
  # rather than a bare `next dev` — the same shape as docker-compose.yml, run
  # here as plain processes instead of Docker builds for CI speed. Lighthouse's
  # `minScore: 0.95` assertions (see qa/lighthouserc.js) make this job's status
  # the actual CI gate — a regression fails the job, not just a local script.
  # ---------------------------------------------------------------------------
  e2e-and-lighthouse:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vng
          POSTGRES_USER: vng
          POSTGRES_PASSWORD: vng
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vng -d vng"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: production
      APP_KEYS: ci-key-1,ci-key-2
      API_TOKEN_SALT: ci-api-token-salt
      ADMIN_JWT_SECRET: ci-admin-jwt-secret
      TRANSFER_TOKEN_SALT: ci-transfer-token-salt
      JWT_SECRET: ci-jwt-secret
      ENCRYPTION_KEY: ci-encryption-key
      DATABASE_CLIENT: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: vng
      DATABASE_USERNAME: vng
      DATABASE_PASSWORD: vng
      DATABASE_SSL: "false"
      SEED: "true"
      STRAPI_URL: http://localhost:1337
      REDIS_URL: redis://localhost:6379
      REVALIDATE_SECRET: ci-revalidate-secret
      WEB_REVALIDATE_URL: http://localhost:3000/api/revalidate
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build cms + web
        run: pnpm turbo run build --filter=@vng/cms --filter=@vng/web
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Start cms (seeded) in the background
        run: nohup pnpm --filter @vng/cms start > cms.log 2>&1 &
      - name: Wait for cms
        run: npx wait-on -t 120000 http://localhost:1337/_health

      - name: Start web in the background
        run: nohup pnpm --filter @vng/web start > web.log 2>&1 &
      - name: Wait for web
        run: npx wait-on -t 60000 http://localhost:3000/vi

      - name: Install Playwright browsers
        run: pnpm --filter @vng/qa exec playwright install --with-deps chromium webkit

      - name: Playwright e2e
        run: pnpm --filter @vng/qa e2e
        env:
          CI: "true"

      - name: Lighthouse CI
        run: pnpm --filter @vng/qa lighthouse
        env:
          CI: "true"

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            qa/playwright-report/
            qa/.lighthouseci/
            cms.log
            web.log
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Deploy stubs — only on main, only for the affected app. The reusable
  # deploy-app.yml (build → ECR → migrations[cms] → ECS blue-green → health
  # check) lands in phase P6; kept as gated no-ops here.
  # ---------------------------------------------------------------------------
  deploy-web:
    needs: [detect, quality]
    if: needs.detect.outputs.web == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy web (implemented in P6 — deploy-app.yml)"

  deploy-cms:
    needs: [detect, quality]
    if: needs.detect.outputs.cms == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy cms (implemented in P6 — deploy-app.yml)"
